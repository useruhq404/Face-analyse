[project]
name = "face-analyse"
version = "1.0.0"
description = "FACE ANALYSE — analyse faciale locale (base consentante) et OSINT par nom. Fait par Aruka."
requires-python = ">=3.12"
authors = [{ name = "Aruka" }]

[project.scripts]
face-analyse = "face_analyse.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
